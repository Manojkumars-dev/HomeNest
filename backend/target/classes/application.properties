# Server
server.port=8080

# Database - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/homenest_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Config
jwt.secret=homenestSecretKey2024SuperLongKeyForHS256Algorithm1234567890ABCDEF
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# CORS (allow React frontend)
spring.web.cors.allowed-origins=http://localhost:5173

# Logging
logging.level.com.homenest=DEBUG
